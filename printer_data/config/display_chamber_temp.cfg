###############################################################################################
### This replaces the default feedrate on the display with the chamber temperature.         ###
### If the temperature target of the bed is >= 100C the glyph includes a heating animation. ###
###############################################################################################

[display_template _sensor_temperature]
param_sensor_name: "temperature_sensor chamber"
text:
  {% set sensor = printer[param_sensor_name] %}
  {% set bed = printer["heater_bed"] %}
  
  # Show Glyph, if bed is heating with target >= 100C show heat animation
  {% if bed.target >= 100 %}
    {% set frame = (printer.toolhead.estimated_print_time|int % 2) + 1 %}
    ~chamber_heat{frame}~
  {% else %}
    ~chamber~
  {% endif %}
  
  # Show temperature
  { "%3.0f" % (sensor.temperature,) }

  # Degrees Glyph
  ~degrees~

# Replace feedrate with chamber temperature
[display_data _default_16x4 speed_factor]
position: 1, 10
text:
  { render("_sensor_temperature", param_sensor_name="temperature_sensor chamber") }


