#####################################################################
# Macros
#####################################################################

# [gcode_macro PRINT_START]
# #   Use PRINT_START for the slicer starting script - please customize for your slicer of choice
# gcode:
#     G28                            ; home all axes
#     G90                            ; absolute positioning    
#     G1 Z20 F3000                   ; move nozzle away from bed

#     SQUIGGLY_PURGE

# Safe Home
[gcode_macro CG28]
gcode:
    {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
    G28
    {% endif %}

[gcode_macro PRINT_START]
gcode:
  # This part fetches data from your slicer. Such as bed, extruder, and chamber temps and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default(0)|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  {% if target_bed > 90 %}
    PID_PROFILE LOAD=B110 HEATER=heater_bed
  {% else %}
    PID_PROFILE LOAD=B60 HEATER=heater_bed
  {% endif %}
  PID_PROFILE LOAD=E260 HEATER=extruder

  SET_FAN_SPEED FAN=bed_fan SPEED=0                     # Turn off bed fan fan
  M107                                                  # Turn off partcooling fan

  M140 S{target_bed}                                    # Start preheating during leveling

  # Home the printer, set absolute positioning and update the Stealthburner LEDs.
  STATUS_HOMING                                         # Set LEDs to homing-mode
  CG28                                                  # Full home (XYZ)
  G90                                                   # Absolute position

  STATUS_HEATING                                        # Set LEDs to heating-mode
  G1 X{x_wait} Y{y_wait} Z15 F9000                      # Go to center of the bed
  
  SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Display info on display
  M190 S{target_bed}                                  # Set the target temp for the bed

  SET_DISPLAY_TEXT MSG="Hotend: 150c"                  # Display info on display
  M104 S150                                            # Set hotend temp to 150c

  # Check if the chamber temp is higher than 40c - if so then trigger a heatsoak.
  {% if target_chamber >= 40 %}
    STATUS_HEATING                                      # Set LEDs to heating-mode

    {% if printer["temperature_sensor chamber"].temperature < target_chamber|float %}
      SET_DISPLAY_TEXT MSG="Bed: 120c"                    # Display info on display
      M190 S120                                           # Set 120c for the bed

      SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber}c"   # Display info on display

      {% if printer["temperature_sensor chamber"].temperature < 35|float %}
        G4 P180000                                        # wait 3 minutes until bed settles
      {% endif %}

      SET_FAN_SPEED FAN=bed_fan SPEED=0.25
      TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={35}   # Waits for chamber temp

      SET_PIN PIN=filter VALUE=1                       # Turn on filter

      SET_FAN_SPEED FAN=bed_fan SPEED=0.35
      TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={40}   # Waits for chamber temp
    {% endif %}
    

    SET_PIN PIN=filter VALUE=1                         # Turn on the nevermore
    SET_FAN_SPEED FAN=bed_fan SPEED=0.50
    M106 S179                                         # Turn on the PT-fan 70%
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}   # Waits for chamber temp

  # If the chamber temp is not over 40c, then skip the heatsoak and just heat up to set temp with a 2 min soak
  {% else %}
    STATUS_HEATING                                      # Set LEDs to heating-mode
    SET_DISPLAY_TEXT MSG="Soak for 2 min"               # Display info on display
    G4 P180000                                          # Wait 2 min for the bedtemp to stabilize
  {% endif %}

  SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Display info on display
  M190 S{target_bed}
  
  # Heat up the hotend up to target via data from slicer
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"     # Display info on display
  STATUS_HEATING                                        # Set LEDs to heating-mode
  M107                                                  # Turn off partcooling fan
  G0 X2 Y2 F10000                                       # Go to starting point
  M109 S{target_extruder}                               # Heat the hotend to set temp

  # Get ready to print by doing a primeline and updating the LEDs
  SET_DISPLAY_TEXT MSG="Printer goes brr"               # Display info on display
  STATUS_PRINTING                                       # Set LEDs to printing-mode
  SQUIGGLY_PURGE
   
[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customize for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-15.0 F3600                ; retract filament
    G91                            ; relative positioning

    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    #   Check end position to determine safe direction to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 2) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    G0 Z{z_safe} F3600             ; move nozzle up
    G0 X{x_safe} Y{y_safe} F20000  ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    SET_FAN_SPEED FAN=bed_fan SPEED=0                     # Turn off bed fan fan
    G90                            ; absolute positioning
    G0 X60 Y{max_y-5} F3600       ; park nozzle at rear
    RESTORE_CONFIG_DEFAULTS
    STATUS_READY
  
[gcode_macro LOAD_FILAMENT]
variable_load_distance:  50
variable_purge_distance:  60
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=load_state
    G91
    G92 E0
    M106 S255
    G1 E{load_distance} F{max_velocity} # fast-load
    G1 E{purge_distance} F{speed} # purge
    M107
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance:  50
variable_initial_scoop_distance: 30
variable_purge_distance:  30
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    G92 E0
    M106 S255
    G1 E{purge_distance} F{speed} # purge
    G1 E-{initial_scoop_distance} F{max_velocity} # fast-scoop
    G1 E-{unload_distance} F600 # unload
    M107
    RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} ; set timeout back to configured value
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    PRINT_END
    BASE_CANCEL_PRINT

[gcode_macro RESTORE_CONFIG_DEFAULTS]
gcode:
    RESPOND TYPE=echo_no_space MSG="Restoring config defaults that could've been changed during print"
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity}
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
    SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity}
    SET_PRESSURE_ADVANCE SMOOTH_TIME={printer.configfile.settings.extruder.pressure_advance_smooth_time} ADVANCE={printer.configfile.settings.extruder.pressure_advance}

[gcode_macro LIGHTS_OFF]
gcode:
  STATUS_OFF
  SET_PIN PIN=caselight VALUE=0.0

[gcode_macro PREPARE_MEASURE_BELTS]
gcode:
  CG28
  AUTO_SPEED_VALIDATE ACCEL=15000 VELOCITY=600 VALIDATE_ITERATIONS=1
  G90
  G1 X60 Y0 F12000
